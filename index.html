<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
		<title>Heart Rooms</title>
		<style>
			:root, html, body {
				width: 100%;
				height: 100%;
				margin: 0;
				padding: 0;
				border: 0;
				overflow: hidden;
				background: #030613;
				touch-action: none;
			}

			body {
				position: fixed;
				inset: 0;
				min-height: 100dvh;
				color: #fff3b5;
				font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
			}

			#canvas {
				display: block;
				width: 100%;
				height: 100%;
				border: 0;
				outline: none;
				image-rendering: pixelated;
			}

			#status, #rotate-notice, #audio-notice {
				position: fixed;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				z-index: 20;
			}

			#status {
				flex-direction: column;
				gap: 14px;
				background: #030613;
			}

			#status-progress {
				width: min(52vw, 260px);
				height: 8px;
				accent-color: #6fe0cf;
			}

			#status-notice {
				max-width: min(80vw, 520px);
				padding: 16px 20px;
				border: 2px solid #6fe0cf;
				background: #101833;
				line-height: 1.6;
				text-align: center;
			}

			#rotate-notice {
				display: none;
				box-sizing: border-box;
				padding: calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
				background: #080d21;
				text-align: center;
				z-index: 40;
			}

			.rotate-card {
				padding: 28px 34px;
				border: 3px solid #6fe0cf;
				box-shadow: 8px 8px 0 #28204d;
				background: #101833;
				font-size: 18px;
				line-height: 1.7;
			}

			.rotate-icon {
				display: block;
				margin-bottom: 10px;
				color: #ff8bb5;
				font-size: 38px;
				font-weight: 700;
			}

			#audio-notice {
				display: none;
				background: rgba(3, 6, 19, 0.50);
				pointer-events: auto;
				z-index: 30;
			}

			#audio-start {
				padding: 10px 18px;
				border: 2px solid #6fe0cf;
				box-shadow: 5px 5px 0 #28204d;
				background: rgba(16, 24, 51, 0.94);
				color: #fff3b5;
				font: inherit;
				font-size: 15px;
				cursor: pointer;
			}

			@media (orientation: portrait) and (max-width: 900px) {
				#rotate-notice { display: flex; }
				#canvas { visibility: hidden; }
				#audio-notice { display: none !important; }
			}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="heart_rooms_web_v5.icon.png" />
<link rel="apple-touch-icon" href="heart_rooms_web_v5.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas" tabindex="0">你的浏览器不支持 Canvas。</canvas>
		<noscript>此游戏需要启用 JavaScript。</noscript>

		<div id="status">
			<progress id="status-progress"></progress>
			<div id="status-notice" hidden></div>
		</div>

		<div id="audio-notice"><button id="audio-start" type="button">🔊 点击开启声音</button></div>
		<audio id="web-bgm" src="heart_rooms_bgm_v2.mp3" preload="auto" loop playsinline></audio>
		<audio id="web-sfx" preload="auto" playsinline></audio>

		<div id="rotate-notice" aria-live="polite">
			<div class="rotate-card">
				<span class="rotate-icon">↻</span>
				请将手机横过来游玩
			</div>
		</div>

		<script src="heart_rooms_web_v5.js"></script>
		<script>
			const godotConfig = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"heart_rooms_web_v5","experimentalVK":false,"fileSizes":{"heart_rooms_web_v5.pck":4438812,"heart_rooms_web_v5.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
			const debugCapture = new URLSearchParams(window.location.search).get('capture');
			if (debugCapture === 'dialogue') {
				godotConfig.args = ['--', '--capture-dialogue'];
			}
			const engine = new Engine(godotConfig);
			const status = document.getElementById('status');
			const progress = document.getElementById('status-progress');
			const notice = document.getElementById('status-notice');
			const audioNotice = document.getElementById('audio-notice');
			const audioStart = document.getElementById('audio-start');
			const webBgm = document.getElementById('web-bgm');
			const webSfx = document.getElementById('web-sfx');
			const canvas = document.getElementById('canvas');
			const sfxFiles = {
				jump: 'heart_sfx_pop_v2.ogg',
				bounce: 'heart_sfx_pop_v2.ogg',
				collect: 'heart_sfx_bi_v2.ogg',
				switch: 'heart_sfx_type_v2.wav',
				dialogue: 'heart_sfx_type_v2.wav',
				firework: 'heart_sfx_firework_v2.mp3',
				door: 'heart_sfx_door_v2.mp3',
				finale: 'heart_sfx_finale_v2.mp3',
				write: 'heart_sfx_write_v2.ogg',
				openbook: 'heart_sfx_openbook_v2.wav',
				match: 'heart_sfx_match_v2.mp3',
				blow: 'heart_sfx_blow_v2.ogg'
			};
			window.HeartRoomAudio = {
				play(id, pitch, volume) {
					const file = sfxFiles[id];
					if (!file) return;
					webSfx.pause();
					if (!webSfx.src.endsWith(file)) webSfx.src = file;
					webSfx.currentTime = 0;
					webSfx.playbackRate = Math.max(0.65, Math.min(1.55, pitch || 1));
					webSfx.volume = Math.max(0, Math.min(1, volume || 0.4));
					webSfx.play().catch(error => console.error('SFX play failed', id, error));
				},
				stop() {
					webSfx.pause();
					webSfx.currentTime = 0;
				}
			};

			function showFailure(error) {
				console.error(error);
				progress.hidden = true;
				notice.hidden = false;
				notice.textContent = error instanceof Error ? error.message : String(error);
			}

			engine.startGame({
				onProgress(current, total) {
					if (current > 0 && total > 0) {
						progress.value = current;
						progress.max = total;
					} else {
						progress.removeAttribute('value');
					}
				}
			}).then(() => {
				status.remove();
				audioNotice.style.display = 'flex';
				canvas.focus();
			}, showFailure);

			async function acknowledgeStart() {
				const playback = webBgm.play();
				try {
					await playback;
					webBgm.volume = 0.48;
					audioNotice.style.display = 'none';
					canvas.focus();
				} catch (error) {
					console.error('Audio start failed', error);
					audioStart.textContent = '🔊 再次点击开启声音';
				}
			}

			audioStart.addEventListener('click', acknowledgeStart);
			window.addEventListener('keydown', (event) => {
				if (event.key === 'Enter' || event.key === ' ') acknowledgeStart();
			}, { once: true });
		</script>
	</body>
</html>
